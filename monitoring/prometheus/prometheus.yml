global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "rnaseq_pipeline"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: "rnaseq_benchmarks"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: "rnaseq_logs"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
