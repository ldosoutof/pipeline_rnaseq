# =============================================================================
# site_paths.yml — Chemins spécifiques à votre installation
# =============================================================================
# Ce fichier est chargé par preprocess.py pour pré-remplir le config.yml
# généré à chaque nouveau run.
#
# À remplir UNE SEULE FOIS à l'installation du pipeline.
# Ne PAS versionner ce fichier (ajoutez-le à .gitignore).
#
# Les clés ici écrasent les valeurs de config_template.yml.
# Seules les clés stables (références, matrices, blacklist...) doivent figurer
# ici. Les clés spécifiques au run (samples, fastq_dir, outputDir) sont
# renseignées automatiquement par preprocess.py.
# =============================================================================

# --- Répertoire racine de tous les runs --------------------------------------
runs_dir: ""

# --- Référentiels génomiques (GRCh38) ----------------------------------------
genome:       ""
star_genome:  ""
kallisto_idx: ""
rsem_genome:  ""
gtfFile:      ""
gtf_refseq:   ""

# --- BED files ---------------------------------------------------------------
bed:      ""
padded:   ""
di_bed:   ""
rseq_bed: ""

# --- Fichiers d'annotation ---------------------------------------------------
panelapp:   ""
hpo:        ""
pheno:      ""
pli:        ""
gnomad:     ""
mendeliome: ""

# --- Matrices de comptage (historique multi-run) -----------------------------
matrices:    ""
matrice_tpm: ""
geneid_map:  ""

# --- FRASER ------------------------------------------------------------------
fraser_count:       ""
fraser_count_hyper: ""

# --- Blacklist unifiée -------------------------------------------------------
blacklist: ""

# --- Fichier Magnis (optionnel) -----------------------------------------------
magnis_file: ""

# --- DeepVariant (optionnel) -------------------------------------------------
sudo_password_file: ""
chrx_bed:    ""
g1000_chrx:  ""
gnomad_chrx: ""
docker_mounts:  ""
docker_workdir: ""

# --- Prometheus --------------------------------------------------------------
prometheus_gateway:          ""
prometheus_gateway_user:     ""
prometheus_gateway_password: ""
prometheus_fallback_dir:     ""

# --- Notifications mail -------------------------------------------------------
smtp_host: ""
smtp_port: 25
mail_from: ""
mail_to:   []

# --- Seuils d'alerte QC ------------------------------------------------------
warn_max_dup:          40.0
warn_max_out_hyper:    20
warn_max_fraser_hyper: 20
warn_max_hba_total:    5000.0
