# =============================================================================
# config_template.yml — Pipeline RNA-seq
# =============================================================================
# Copier ce fichier, renommer en config.yml et remplir les chemins.
# Les chemins doivent être absolus ou relatifs au workdir (OUTPUT_DIR).
# Tous les chemins ci-dessous sont des EXEMPLES — adaptez à votre installation.
# =============================================================================

# --- Répertoire racine de tous les runs (utilisé pour les matrices multi-run) -
runs_dir: "/path/to/runs/"

# --- Répertoire de production du run courant --------------------------------
configuration:
  fastq_dir:    "/path/to/run/fastq/"
  outputDir:    "/path/to/run/"
  pipeline_dir: "/path/to/pipeline/"
  # Dossier des environnements conda créés par Snakemake (= --conda-prefix de
  # launch_template.sh). Utilisé pour tracer les versions des outils.
  conda_prefix: "~/pipeline/RNASEQ/routine/conda_env"
  samples:
    - "SAMPLE_ID_1"
    - "SAMPLE_ID_2"

# --- Référentiels génomiques (GRCh38) ----------------------------------------
genome:       "/path/to/references/GRCh38/genome.fa"
star_genome:  "/path/to/references/GRCh38/STAR/"
kallisto_idx: "/path/to/references/GRCh38/kallisto/transcripts.idx"
rsem_genome:  "/path/to/references/GRCh38/rsem/hg38"
# --- Annotations génomiques ---------------------------------------------------
# DEUX sources d'annotation sont utilisées intentionnellement :
#
#   gtfFile    → pipeline NORMAL (HTSeq / Kallisto / OUTRIDER htseq)
#                Doit être un GTF Ensembl (ex: Homo_sapiens.GRCh38.106.gtf).
#                Requis pour build_geneid_ensg_map.py (db_xref GeneID: → ENSG).
#                Attribut gene_id = ENSG directement.
#
#   gtf_refseq → pipeline HYPER (featureCounts CDS / OUTRIDER hyper)
#                Deux formats supportés par map_refseq_to_ensembl :
#                  a) GTF NCBI RefSeq : gene_id = GeneID numérique
#                     → remapping GeneID→ENSG via gid_map (Ensembl GTF requis)
#                  b) GTF GENCODE (ex: gencode.v49.basic.annotation.nochr.gtf) :
#                     gene_id = ENSG.version → version strippée automatiquement,
#                     gid_map non utilisé (avertissement dans le log)
#                  c) GTF Ensembl (même que gtfFile) : gene_id = ENSG plain → pass-through
#
#                ⚠ Les deux voies (htseq vs featureCounts) utilisent des espaces
#                de gènes légèrement différents selon la version d'annotation.
#                C'est voulu : la voie hyper cible les CDS RefSeq pour capturer
#                les aberrations d'expression dans les régions codantes uniquement.
#                Valider que les gènes du panel DI sont couverts dans les deux GTF
#                (script annotation_coverage.py — voir docs/annotation_coverage.md).
#
gtfFile:      "/path/to/references/GRCh38/annotation/Homo_sapiens.GRCh38.106.gtf"
gtf_refseq:   "/path/to/references/GRCh38/annotation/gencode.v49.basic.annotation.nochr.gtf"

# --- BED files ---------------------------------------------------------------
bed:     "/path/to/references/bed/covered.bed"
padded:  "/path/to/references/bed/padded.bed"
di_bed:  "/path/to/references/bed/DI.bed"
rseq_bed: "/path/to/references/bed/rseqc.bed"

# --- Fichiers d'annotation ---------------------------------------------------
panelapp: "/path/to/references/annotation/panelapp_DI_green.tsv"
hpo:      "/path/to/references/annotation/phenotype.hpoa"
pheno:    "/path/to/references/annotation/genes_to_phenotype.txt"
pli:      "/path/to/references/annotation/PLI.vcf"
gnomad:   "/path/to/references/annotation/gnomad.v4.1.constraint_metrics.tsv"
mendeliome: "/path/to/references/annotation/mendeliome.json"

# --- Matrices de comptage (historique multi-run) -----------------------------
matrices:    "/path/to/data/matrices_htseq/"
matrice_tpm: "/path/to/data/matrices_tpm/"
geneid_map:  "/path/to/data/geneid_to_ensg.tsv"

# --- FRASER ------------------------------------------------------------------
fraser_count:       "/path/to/data/fraser_counts/"
fraser_count_hyper: "/path/to/data/fraser_counts_hyper/"

# --- Blacklist unifiée (TSV : sample_id <TAB> tool <TAB> reason) ------------
# tool : outrider | fraser | pca | all
# Voir template/blacklist_template.tsv pour le format
blacklist: "/path/to/data/blacklist.tsv"

# Runs à exclure des analyses spécifiques (remplace tout filtre hardcodé dans le code).
# Liste séparée par des virgules, ex: "RUN17,RUN23" ou "20231122_RUN17_NextSeq_Mid_8RNASEQ"
# Laisser vide pour ne rien exclure.
#
# fraser_excluded_runs → utilisé par fraser_config_create.py (BAM scan)
# pca_excluded_runs   → utilisé par generate_and_run_param_notebook (PCA / notebook)
# Si un run est problématique pour les deux, le renseigner dans les deux clés.
fraser_excluded_runs: ""
pca_excluded_runs:    ""

# --- Mots-clés sang (pour filtrer les échantillons OUTRIDER / FRASER) --------
fraser_keywords: "MOINS PUROMOINS"

# --- Fichier Magnis (optionnel — enrichissement ID_SPICE dans annotation FRASER) -
magnis_file: ""

# --- DeepVariant (règle 07_variantCalling_bis — activé par défaut) -----------
# Analyse du biais d'inactivation X (DeepVariant chrX, modèle WES).
# Mettre run_variant_calling: false pour la désactiver sur un run donné.
# Nécessite Singularity/Apptainer et --use-singularity au lancement de Snakemake.
run_variant_calling: true
deepvariant_image: "docker://google/deepvariant:1.8.0"
# Chemins fictifs volontaires : les chemins réels de chrx_bed, g1000_chrx et
# gnomad_chrx sont fournis par template/site_paths.yml, que preprocess.py
# fusionne par-dessus ce template (les valeurs non vides du site l'emportent).
chrx_bed:    "/path/to/references/bed/chrX_capture.bed"
g1000_chrx:  "/path/to/references/annotation/1000G_chrX.vcf.gz"
gnomad_chrx: "/path/to/references/annotation/gnomad_chrX.vcf.bgz"

# --- Contrôle positif biais X (optionnel) ------------------------------------
x_bias_control_vaf:   ""
x_bias_control_label: ""

# --- Snakemake binary (pour save_rulegraph) ----------------------------------
# Laisser "snakemake" si snakemake est dans le PATH de l'env conda utilisé.
# Sinon spécifier le chemin complet ex: "/appli/miniconda3/envs/snakemake/bin/snakemake"
snakemake_bin: "snakemake"

# --- Notifications mail -------------------------------------------------------
smtp_host: "localhost"
smtp_port: 25
mail_from: "pipeline@institution.fr"
mail_to:
  - "user@institution.fr"

# --- Seuils d'alerte QC (fichier metrics/qc_warnings.tsv) --------------------
warn_max_dup:          40.0    # % duplication (Picard MarkDuplicates)
warn_max_out_hyper:    20      # nb événements OUTRIDER hyper par échantillon
warn_max_fraser_hyper: 20      # nb événements FRASER hyper par échantillon
warn_max_hba_total:    5000.0  # TPM cumulé HBA1+HBA2+HBB (contamination érythrocytaire)

# --- Synchronisation des résultats vers sitatst (interface metrics) -----------
# Déclenché en fin de pipeline (onsuccess), BLOQUANT : transfère pipeline_v0/
# vers sitatst ; le watcher de sitatst ingère ensuite les métriques dans la base QC.
sync_sitatst:
  enabled:    false                       # true pour activer le transfert
  host:       "172.27.253.113"            # serveur sitatst (interface metrics)
  user:       "ldosouto"
  dest_path:  "/data2/Exome_analysis_BC/Server_S_exome/MAGNIS/Runs_nextseq"  # convention existante : <run>/pipeline_v0/ ajouté automatiquement
  ssh_key:    "~/.ssh/id_ovh_to_sitatst"  # clé SSH dédiée OVH->sitatst (recommandé)
  pass_file:  ""                          # alternative : fichier chmod 600 avec mot de passe (si pas de clé)

# --- CIBERSORTx : déconvolution cellulaire (LM22) -----------------------------
# Estime les proportions de 22 types cellulaires immunitaires par échantillon.
# Nécessite Apptainer + l'image CIBERSORTx (.SIF) + LM22.txt + un token Stanford.
# ATTENTION (usage diagnostique) : LM22 est conçu pour tissu sanguin/immunitaire ;
# valider la pertinence biologique pour vos échantillons. Le token appelle un
# serveur externe (Stanford) — dépendance à évaluer en contexte ISO 15189.
cibersortx:
  enabled:    false                       # true pour activer la déconvolution
  sif:        ""                          # ex: /appli/containers/cibersortx_fractions.sif
  lm22:       ""                          # ex: /dataref/bank/human/annotation/cibersortx/LM22.txt
  email:      ""                          # email enregistré sur cibersortx.stanford.edu
  token_file: ""                          # fichier chmod 600 contenant le token (hors dépôt)
  perm:       100                         # nb de permutations (p-value)
  qn:         "FALSE"                      # quantile normalization : FALSE pour RNA-seq (TRUE = microarray)
